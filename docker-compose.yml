services:
  postgres:
    image: postgres:17-alpine
    container_name: raiz-del-rio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-raiz_del_rio}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./server/prisma/migrations/20261030_supabase_schema/migration.sql:/docker-entrypoint-initdb.d/01-migration.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-raiz_del_rio}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: raiz-del-rio-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/raiz_del_rio}
      DIRECT_URL: ${DIRECT_URL:-postgresql://postgres:postgres@postgres:5432/raiz_del_rio}
      JWT_SECRET: ${JWT_SECRET:-raiz-del-rio-docker-jwt-secret-key-min-32-chars}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
