name: Verify
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.11.0
      - run: npm ci
      - run: npm run env:check
      - run: npm run harness:check
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
